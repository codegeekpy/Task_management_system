<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TaskFlow — Minimal Task Management</title>
  <meta name="description" content="A simple, minimalist real-time task management web application.">

  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%236366f1'><circle cx='12' cy='12' r='10'/></svg>">
</head>
<body>
  <div class="app-layout">

    <!-- Clean, Minimal Header -->
    <header class="app-header">
      <div class="header-left">
        <div class="brand">
          <span class="brand-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"></path></svg>
          </span>
          <span class="brand-title">TaskFlow</span>
        </div>

        <div class="live-dot-badge" id="liveStatusBadge" title="Real-time WebSocket Live Sync">
          <span class="pulse-dot"></span>
          <span class="live-text">Live</span>
        </div>

        <!-- View Navigation -->
        <nav class="view-tabs">
          <button class="tab-btn active" data-view="kanban" id="tabKanban">Board</button>
          <button class="tab-btn" data-view="list" id="tabList">List</button>
        </nav>
      </div>

      <div class="header-right">
        <!-- Quick Search -->
        <div class="search-input-wrap">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
          <input type="text" id="globalSearchInput" placeholder="Search tasks...">
        </div>

        <!-- New Task Button -->
        <button class="btn btn-primary" id="btnNewTask">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"></line><line x1="5" y1="12" x2="19" y2="12"></line></svg>
          <span>New Task</span>
        </button>

        <!-- Theme Toggle -->
        <button class="btn-icon" id="btnThemeToggle" title="Toggle Light/Dark Theme" aria-label="Toggle theme">
          <svg class="sun-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line></svg>
          <svg class="moon-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
        </button>

        <!-- User Menu Trigger -->
        <div class="user-menu-wrap">
          <button class="user-btn" id="userProfileBtn" aria-haspopup="true">
            <img id="navUserAvatar" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100" alt="Avatar">
            <span id="navUserName">Alex Morgan</span>
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"></polyline></svg>
          </button>

          <!-- Dropdown -->
          <div class="user-dropdown" id="profileDropdown">
            <div class="dropdown-header">
              <span class="user-full-name" id="dropdownUserName">Alex Morgan</span>
              <span class="user-email-text" id="dropdownUserEmail">alex@taskflow.dev</span>
            </div>
            <div class="dropdown-divider"></div>
            <div class="dropdown-label">Switch User (1-Click)</div>
            <div class="demo-user-list" id="demoSwitchList">
              <!-- Dynamically populated -->
            </div>
            <div class="dropdown-divider"></div>
            <button class="dropdown-link" id="btnOpenCreateUser">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><line x1="20" y1="8" x2="20" y2="14"></line><line x1="23" y1="11" x2="17" y2="11"></line></svg>
              <span>+ Create New User</span>
            </button>
            <button class="dropdown-link" id="btnOpenSignIn">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"></path><polyline points="10 17 15 12 10 7"></polyline><line x1="15" y1="12" x2="3" y2="12"></line></svg>
              <span>Sign In with Account</span>
            </button>
            <button class="dropdown-link" id="btnResetData">Reset Demo Tasks</button>
            <button class="dropdown-link text-danger" id="btnLogout">Sign Out</button>
          </div>
        </div>
      </div>
    </header>

    <!-- Main Workspace Container -->
    <main class="main-body">

      <!-- Minimal Subheader & Filters -->
      <div class="toolbar">
        <div class="filter-pills">
          <button class="filter-pill active" data-filter="all">All Tasks</button>
          <button class="filter-pill" data-filter="my-tasks" id="filterMyTasks">Assigned to Me</button>
          <button class="filter-pill" data-filter="urgent">Urgent</button>
        </div>
        <span class="task-counter-text" id="counterTotalTasks">3 tasks</span>
      </div>

      <!-- 1. Kanban Board View -->
      <section class="view-section active" id="viewKanban">
        <div class="kanban-grid">
          <!-- Column: To Do -->
          <div class="kanban-col" data-status="todo" id="col-todo">
            <div class="col-head">
              <div class="col-title">
                <span class="col-indicator dot-todo"></span>
                <span>To Do</span>
                <span class="col-badge" id="count-todo">0</span>
              </div>
              <button class="btn-add-inline" data-status="todo" title="Add task">+</button>
            </div>
            <div class="cards-list" data-status="todo" id="cards-todo"></div>
          </div>

          <!-- Column: In Progress -->
          <div class="kanban-col" data-status="in_progress" id="col-in_progress">
            <div class="col-head">
              <div class="col-title">
                <span class="col-indicator dot-in_progress"></span>
                <span>In Progress</span>
                <span class="col-badge" id="count-in_progress">0</span>
              </div>
              <button class="btn-add-inline" data-status="in_progress" title="Add task">+</button>
            </div>
            <div class="cards-list" data-status="in_progress" id="cards-in_progress"></div>
          </div>

          <!-- Column: Completed -->
          <div class="kanban-col" data-status="completed" id="col-completed">
            <div class="col-head">
              <div class="col-title">
                <span class="col-indicator dot-completed"></span>
                <span>Completed</span>
                <span class="col-badge" id="count-completed">0</span>
              </div>
              <button class="btn-add-inline" data-status="completed" title="Add task">+</button>
            </div>
            <div class="cards-list" data-status="completed" id="cards-completed"></div>
          </div>
        </div>
      </section>

      <!-- 2. Clean List View -->
      <section class="view-section" id="viewList">
        <div class="list-wrapper">
          <table class="minimal-table">
            <thead>
              <tr>
                <th>Title</th>
                <th>Status</th>
                <th>Priority</th>
                <th>Assignee</th>
                <th>Due Date</th>
                <th style="text-align: right;">Actions</th>
              </tr>
            </thead>
            <tbody id="tasksTableBody"></tbody>
          </table>
        </div>
      </section>

    </main>

    <!-- Clean Task Modal (Create & Edit) -->
    <div class="modal-backdrop" id="taskModalOverlay" role="dialog" aria-modal="true">
      <div class="modal-card">
        <div class="modal-top">
          <h2 class="modal-heading" id="taskModalTitle">Create Task</h2>
          <button class="modal-close" id="btnTaskModalClose">&times;</button>
        </div>
        <form id="taskForm" class="modal-body">
          <input type="hidden" id="taskFormId" value="">

          <div class="field">
            <label for="taskTitleInput" class="field-label">Title</label>
            <input type="text" id="taskTitleInput" class="input-text" placeholder="Task name..." required>
          </div>

          <div class="field">
            <label for="taskDescInput" class="field-label">Description (Optional)</label>
            <textarea id="taskDescInput" class="input-text" rows="2" placeholder="Brief details..."></textarea>
          </div>

          <div class="field-row">
            <div class="field">
              <label for="taskStatusSelect" class="field-label">Status</label>
              <select id="taskStatusSelect" class="input-select">
                <option value="todo">To Do</option>
                <option value="in_progress">In Progress</option>
                <option value="completed">Completed</option>
              </select>
            </div>

            <div class="field">
              <label for="taskPrioritySelect" class="field-label">Priority</label>
              <select id="taskPrioritySelect" class="input-select">
                <option value="low">Low</option>
                <option value="medium" selected>Medium</option>
                <option value="high">High</option>
                <option value="urgent">Urgent</option>
              </select>
            </div>
          </div>

          <div class="field-row">
            <div class="field">
              <label for="taskDueDateInput" class="field-label">Due Date</label>
              <input type="date" id="taskDueDateInput" class="input-text">
            </div>

            <div class="field">
              <label for="taskAssigneeSelect" class="field-label">Assignee</label>
              <select id="taskAssigneeSelect" class="input-select"></select>
            </div>
          </div>

          <div class="modal-bottom">
            <button type="button" class="btn btn-ghost" id="btnCancelTaskModal">Cancel</button>
            <button type="submit" class="btn btn-primary" id="btnSaveTask">
              <span id="btnSaveTaskText">Create Task</span>
            </button>
          </div>
        </form>
      </div>
    </div>

    <!-- Minimal Auth Modal -->
    <div class="modal-backdrop" id="authModalOverlay" role="dialog" aria-modal="true">
      <div class="modal-card modal-auth">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
          <div class="auth-tabs-minimal">
            <button class="auth-tab-minimal active" id="tabAuthSignIn">Sign In</button>
            <button class="auth-tab-minimal" id="tabAuthCreateUser">Create User</button>
          </div>
          <button class="modal-close" id="btnAuthModalClose" style="font-size:1.1rem;" title="Close">&times;</button>
        </div>

        <!-- 1. Sign In Section -->
        <div id="authSectionSignIn">
          <p class="text-subtle" style="font-size:0.75rem; margin-bottom:10px; color:var(--text-muted);">Quick demo login:</p>
          <div class="quick-login-row">
            <button class="quick-user-btn" data-demo-email="alex@taskflow.dev">
              <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100" alt="Alex">
              <span>Alex Morgan</span>
            </button>
            <button class="quick-user-btn" data-demo-email="sarah@taskflow.dev">
              <img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330?w=100" alt="Sarah">
              <span>Sarah Chen</span>
            </button>
          </div>

          <div class="or-separator">or credentials</div>

          <form id="loginForm" class="modal-body" style="padding: 0;">
            <div class="field">
              <input type="email" id="loginEmail" class="input-text" placeholder="Email (alex@taskflow.dev)" required>
            </div>
            <div class="field">
              <input type="password" id="loginPassword" class="input-text" placeholder="Password (password123)" required>
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 4px;" id="btnLoginSubmit">Sign In</button>
          </form>
        </div>

        <!-- 2. Create User Section -->
        <div id="authSectionCreateUser" style="display: none;">
          <form id="registerForm" class="modal-body" style="padding: 0;">
            <div class="field">
              <label for="regName" class="field-label">Full Name</label>
              <input type="text" id="regName" class="input-text" placeholder="e.g. John Doe" required>
            </div>
            <div class="field">
              <label for="regEmail" class="field-label">Email Address</label>
              <input type="email" id="regEmail" class="input-text" placeholder="john@company.com" required>
            </div>
            <div class="field">
              <label for="regPassword" class="field-label">Password (min 6 chars)</label>
              <input type="password" id="regPassword" class="input-text" placeholder="••••••••" minlength="6" required>
            </div>
            <div class="field">
              <label for="regRole" class="field-label">Role</label>
              <select id="regRole" class="input-select">
                <option value="Developer">Developer</option>
                <option value="Designer">Designer</option>
                <option value="Product Manager">Product Manager</option>
                <option value="Team Lead">Team Lead</option>
                <option value="QA Engineer">QA Engineer</option>
              </select>
            </div>
            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 8px;" id="btnRegisterSubmit">Create User & Sign In</button>
          </form>
        </div>
      </div>
    </div>

    <!-- Notification Toast Container -->
    <div class="toast-wrapper" id="toastContainer"></div>

  </div>

  <script src="js/api.js"></script>
  <script src="js/toast.js"></script>
  <script src="js/ws.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/modal.js"></script>
  <script src="js/kanban.js"></script>
  <script src="js/list.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
